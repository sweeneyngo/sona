[package]
name = "sona-eval"
description = "Offline evaluation harness (ADR-0011): measure the perception pipeline against labeled vocal data (Vocadito + golden fixtures). Not shipped to users — it is the ruler, not the product."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Reuse the core's Hz->MIDI conversion and (later tickets) run the pipeline.
sona-core.workspace = true
# The common reference type + golden-fixture ground truth are serde JSON.
serde.workspace = true
serde_json.workspace = true
# Decode fixture WAVs. The core is deliberately I/O-free (it takes mono `&[f32]`),
# so WAV decoding lives here, as it does in the CLI.
hound.workspace = true

# The report harness: runs the pipeline over each stem and scores it with the
# metrics, printing the per-stage baseline table.
[[bin]]
name = "sona-eval-report"
path = "src/bin/report.rs"

# Regenerates the committed golden fixtures (WAV + ground-truth reference JSON).
[[bin]]
name = "sona-eval-gen-fixtures"
path = "src/bin/gen_fixtures.rs"

# Sweeps the note-HMM's Stable self-transition + interval λ against the ADR-0007
# baseline on Vocadito + fixtures — the Phase-B payoff gate.
[[bin]]
name = "sona-eval-sweep"
path = "src/bin/sweep.rs"

# Aggregates correction cost across saved review sessions, per producer — the
# by-ear scoreboard ("how much manual correction did the output need").
[[bin]]
name = "sona-eval-correction"
path = "src/bin/correction_report.rs"

# Scores saved sessions (corrected notes as ground truth, baseline as estimate):
# note-F1, onset-F1, and confidence calibration — the calibration signal.
[[bin]]
name = "sona-eval-session"
path = "src/bin/session_report.rs"

# Pools notes across sessions and asks which sub-scores predict correctness (AUC),
# then searches for better confidence weights with a train/test split.
[[bin]]
name = "sona-eval-calibrate"
path = "src/bin/calibrate_report.rs"
