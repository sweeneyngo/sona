[package]
name = "sona-eval"
description = "Offline evaluation harness (ADR-0011): measure the perception pipeline against labeled vocal data (Vocadito + golden fixtures). Not shipped to users — it is the ruler, not the product."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Forwards to sona-core's spectral code: grid mode's spectral re-articulation
# cue (ADR-0016) and the spectral-flux onsets (ADR-0013). On by default.
default = ["spectral"]
spectral = ["sona-core/spectral"]
# GAME note extraction (sona-core `game`): `game=<presence threshold>` configs in
# sona-eval-ust-dev, with SONA_GAME_DIR naming a GAME ONNX release folder.
game = ["sona-core/game"]

[dependencies]
# Reuse the core's Hz->MIDI conversion and (later tickets) run the pipeline.
sona-core.workspace = true
# The common reference type + golden-fixture ground truth are serde JSON.
serde.workspace = true
serde_json.workspace = true
# Decode fixture WAVs. The core is deliberately I/O-free (it takes mono `&[f32]`),
# so WAV decoding lives here, as it does in the CLI.
hound.workspace = true
# Decode UST files explicitly (Shift-JIS by default, UTF-8 when declared/valid).
encoding_rs.workspace = true

# The report harness: runs the pipeline over each stem and scores it with the
# metrics, printing the per-stage baseline table.
[[bin]]
name = "sona-eval-report"
path = "src/bin/report.rs"

# Regenerates the committed golden fixtures (WAV + ground-truth reference JSON).
[[bin]]
name = "sona-eval-gen-fixtures"
path = "src/bin/gen_fixtures.rs"

# Sweeps the note-HMM's Stable self-transition + interval λ against the ADR-0007
# baseline on Vocadito + fixtures — the Phase-B payoff gate.
[[bin]]
name = "sona-eval-sweep"
path = "src/bin/sweep.rs"

# A/B's the note-offset Release path (ADR-0012) vs. Release-off on the same
# corpus, sweeping the fall bonus × threshold — the offset-precision payoff gate.
[[bin]]
name = "sona-eval-release-sweep"
path = "src/bin/release_sweep.rs"

# Signed onset-deviation histogram: is the onset-F1 dip a systematic timing bias
# (free constant-correction fix) or genuinely hard attacks (spectral flux)?
[[bin]]
name = "sona-eval-onset-deviation"
path = "src/bin/onset_deviation.rs"

# Energy-rise vs spectral-flux onsets (ADR-0013 gate): onset P/R/F1 side by side
# on the same corpus. Build with `--features spectral` for the spectral arm.
[[bin]]
name = "sona-eval-onset-compare"
path = "src/bin/onset_compare.rs"

# Note-level onset gate (ADR-0013 / ticket 04): full-pipeline note COnP/COnPOff by
# onset source (energy / SuperFlux / ensemble). Requires spectral (builds SuperFlux).
[[bin]]
name = "sona-eval-note-onset-gate"
path = "src/bin/note_onset_gate.rs"
required-features = ["spectral"]

# Aggregates correction cost across saved review sessions, per producer — the
# by-ear scoreboard ("how much manual correction did the output need").
[[bin]]
name = "sona-eval-correction"
path = "src/bin/correction_report.rs"

# Scores saved sessions (corrected notes as ground truth, baseline as estimate):
# note-F1, onset-F1, and confidence calibration — the calibration signal.
[[bin]]
name = "sona-eval-session"
path = "src/bin/session_report.rs"

# Pools notes across sessions and asks which sub-scores predict correctness (AUC),
# then searches for better confidence weights with a train/test split.
[[bin]]
name = "sona-eval-calibrate"
path = "src/bin/calibrate_report.rs"

# UST format audit (UST corpus gate, ticket 01): per UST, the rest-terminated note
# fraction (how much genuine offset signal exists), grid-alignment tightness, and
# notes below the prune floor. Fixtures by default; `--corpus` for the UST cache.
[[bin]]
name = "sona-eval-ust-audit"
path = "src/bin/ust_audit.rs"

# UST → MIDI (UST corpus gate, ticket 04): rests/breaths become gaps, written at
# the UST's own tempo, for eyeballing a UST's note data.
[[bin]]
name = "sona-eval-ust-to-midi"
path = "src/bin/ust_to_midi.rs"

# UST corpus manifest check (UST corpus gate, ticket 02): validates every song's
# USTs against corpus/ust-manifest.json; `--fill` writes bpm_from_ust/grid_division.
[[bin]]
name = "sona-eval-ust-manifest"
path = "src/bin/ust_manifest.rs"

# UST phase alignment (UST corpus gate, ticket 05): offset set WITHOUT sona
# (vocal-loudness coarse + drum-onset fine), verified WITH sona's onsets.
# `--write` records alignment_offset_s + alignment_status in the manifest.
[[bin]]
name = "sona-eval-ust-align"
path = "src/bin/ust_align.rs"

# The in-domain gate (UST corpus gate, ticket 06): sona vs. UST, raw and
# quantized, all notes and monophonic regions, per stratum; `--vocadito` adds the
# proxy-domain baseline with the same conditional offset measure.
[[bin]]
name = "sona-eval-ust-gate"
path = "src/bin/ust_gate.rs"

[[bin]]
name = "sona-eval-ust-dev"
path = "src/bin/ust_dev.rs"
