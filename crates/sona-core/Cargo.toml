[package]
name = "sona-core"
description = "Headless perception core: vocal stem -> annotation JSON (raw note events, confidence, f0 contour, energy envelope)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
midly.workspace = true
serde.workspace = true
# CREPE (ONNX via ort) is behind the `crepe` feature — the pYIN default backend
# needs no ONNX runtime. See ADR-0001 and ticket 11.
ort = { workspace = true, optional = true }
# `spectral` (on by default since holdout2 confirmed ADR-0016): the pure-Rust
# FFT behind grid mode's spectral re-articulation cue and the optional
# spectral-flux onsets (ADR-0013). The note-HMM default path doesn't use it.
realfft = { workspace = true, optional = true }

[features]
default = ["spectral"]
crepe = ["dep:ort"]
# GAME note extraction (openvpi; weights user-downloaded, CC BY-NC-SA). ONNX
# Runtime is loaded dynamically from ORT_DYLIB_PATH. See src/game.rs.
game = ["dep:ort"]
spectral = ["dep:realfft"]

[dev-dependencies]
serde_json.workspace = true
