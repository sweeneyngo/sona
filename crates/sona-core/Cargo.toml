[package]
name = "sona-core"
description = "Headless perception core: vocal stem -> annotation JSON (raw note events, confidence, f0 contour, energy envelope)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
midly.workspace = true
serde.workspace = true
# ONNX Runtime, only with `game`: the pYIN default backend needs none (ADR-0001).
ort = { workspace = true, optional = true }
# `spectral` (on by default since holdout2 confirmed ADR-0016): the pure-Rust
# FFT behind grid mode's spectral re-articulation cue and the tempo estimator
# (ADR-0022). The note-HMM path doesn't use it.
realfft = { workspace = true, optional = true }
# Reads the learned cell stage's `cellstage.json` (ADR-0026); only with `game`.
serde_json = { workspace = true, optional = true }
half.workspace = true

[features]
default = ["spectral"]
# GAME note extraction (openvpi; weights user-downloaded, CC BY-NC-SA). ONNX
# Runtime is loaded dynamically from ORT_DYLIB_PATH. See src/game.rs.
game = ["dep:ort", "dep:realfft", "dep:serde_json"]
spectral = ["dep:realfft"]

[dev-dependencies]
serde_json.workspace = true
