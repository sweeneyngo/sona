[package]
name = "sona-cli"
description = "Command-line front-end to sona-core: stem -> annotation JSON (and optional raw MIDI)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Records the git commit of the build for provenance (ADR-0024).
build = "build.rs"

[[bin]]
name = "sona"
path = "src/main.rs"

[dependencies]
sona-core.workspace = true
# Serialize the annotation contract to stdout (the core defines the serde types).
serde_json.workspace = true
# WAV decoding is a CLI (I/O) concern; the core takes mono `&[f32]`. `hound` is
# pure-Rust, no system codec — a stem is decoded and downmixed to mono here.
hound.workspace = true
sha2.workspace = true

[features]
default = ["spectral"]
# Forward the CREPE backend feature down to the core.
crepe = ["sona-core/crepe"]
# Spectral features (pure-Rust FFT) for `--spectral-cue` (ADR-0016).
spectral = ["sona-core/spectral"]
# GAME note extraction for `--game <DIR>` (ADR-0017). The weights are
# user-downloaded (CC BY-NC-SA); ONNX Runtime loads from ORT_DYLIB_PATH.
game = ["sona-core/game"]
