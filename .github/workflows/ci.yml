# Checks that encode what the project has learned, so a contributor (human or
# agent) can't regress it by forgetting. See docs/agents/rules.md for the
# rules that need judgment and can't be checked here.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  corpus-data:
    # Pifuyuu's USTs forbid redistribution and the source songs are commercial:
    # nothing from crates/sona-eval/data/ may ever be tracked.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: scripts/ci/check-no-corpus-data.sh

  holdout-read-policy:
    # Who may read holdout4 and what each tool logs (utau-edit-cost 17): one read, resumes logged, the frame
    # read after it. Pure Python, no corpus data.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 -I -B crates/sona-eval/scripts/holdout4-read/test_read.py

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned to rust-toolchain.toml's channel: same lints as local builds.
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Includes the output invariants (crates/sona-core/tests/output_invariants.rs),
      # the exhaustive grid path test, and the quantizer cases shared with grid.ts.
      - name: test
        run: cargo test --workspace --release
      # `spectral` is a default feature (ADR-0016); keep the FFT-free core building.
      - name: core builds without default features
        run: cargo check -p sona-core --no-default-features
      # GAME (sona-core `game`) is opt-in: its weights are user-downloaded
      # (CC BY-NC-SA) and ONNX Runtime loads at run time, so lint and unit-test
      # the feature here (the snapping and chunking tests need no model).
      - name: game feature (lint + tests)
        run: |
          cargo clippy -p sona-core -p sona-eval -p sona-cli --features sona-core/game,sona-eval/game,sona-cli/game --all-targets -- -D warnings
          cargo test -p sona-core --release --features game game::

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # Includes the grid.ts / quantize.rs drift guard (shared fixtures/quantize cases).
      - run: npx vitest run

  e2e:
    # The editor's browser drivers (web/e2e, every one that needs no `sona serve`) on the synthetic
    # fixture, against a Vite dev server. scripts/ci/e2e.sh is the same run locally.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SONA_E2E_OUT: ${{ github.workspace }}/e2e-out
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: npm ci
        working-directory: web
      # Pinned: Playwright fixes the Chromium build, so a release can't change what the drivers see.
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: scripts/ci/e2e.sh
        env:
          SONA_E2E_PYTHON: python
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: |
            ${{ env.SONA_E2E_OUT }}
            !${{ env.SONA_E2E_OUT }}/fixture-*
          if-no-files-found: ignore

  model-check:
    # TLA+ model of grid-mode note assembly + review-surface snap
    # (verification/grid-notes): every rule, plus mutants that must be caught.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: fetch tla2tools 1.7.4 (pinned by sha256)
        run: |
          mkdir -p "$HOME/.cache/tla"
          curl -sSL -o "$HOME/.cache/tla/tla2tools.jar" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $HOME/.cache/tla/tla2tools.jar" | sha256sum -c -
      - run: verification/grid-notes/check.sh
      # TLA+ model of the inline lyric editor (verification/lyric-editor, ADR-0018).
      - run: verification/lyric-editor/check.sh
      # TLA+ model of the pitch expression bar (verification/expr-bar, ADR-0019).
      - run: verification/expr-bar/check.sh
      # TLA+ model of sona serve's job queue (verification/serve-jobs, ADR-0020).
      - run: verification/serve-jobs/check.sh
      # TLA+ model of the start screen (verification/start-flow, ADR-0022).
      - run: verification/start-flow/check.sh
