[workspace]
resolver = "2"
members = ["crates/sona-core", "crates/sona-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/sweeneyngo/sona"

[workspace.dependencies]
# Perception core deps.
# pYIN (ticket 03) is hand-rolled pure-Rust DSP — no pitch crate. `pitch-detection`
# (the scaffold's placeholder) implements MPM, not YIN; `aubio-rs` binds a C lib.
# See ADR-0001 / ADR-0005.
midly = "0.5"
# Annotation JSON contract (ticket 02): the core<->UI artifact is serde-defined.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# WAV decode for the CLI (ticket 07): a stem is I/O the core doesn't do — it takes
# mono `&[f32]`. `hound` is pure-Rust, no system codec.
hound = "3.5"
# CREPE backend (ONNX) — feature-gated, wired now, used in a later ticket.
# `load-dynamic` (no default `download-binaries`) keeps scaffolding free of a
# network fetch + openssl toolchain; the ONNX runtime is resolved at load time
# when the real CREPE tracker lands (ticket 11).
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic"] }

# Internal
sona-core = { path = "crates/sona-core" }
